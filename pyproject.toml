[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-aware-scm"
version = "1.0.0"
description = "Regime-Aware Cooperation in Multi-Echelon Inventory Control: Curriculum Pretraining and a Zero-Shot LLM Supervisor"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Chinmayee S Bharadwaj", email = "chinmayee.cd23@bmsce.ac.in" },
    { name = "Taran Thimmaiah", email = "taranthimmaiah.cd23@bmsce.ac.in" },
    { name = "Alvin S Thottappilly", email = "alvins.cd23@bmsce.ac.in" },
    { name = "Manoj Kumar", email = "manojkumar.cds@bmsce.ac.in" }
]
keywords = [
    "multi-echelon inventory management",
    "multi-agent reinforcement learning",
    "large language models",
    "curriculum learning",
    "zero-shot generalization",
    "bullwhip effect",
    "HAPPO"
]
dependencies = [
    "torch>=1.13.0",
    "gym==0.26.2",
    "numpy>=1.23.4,<2.0.0",
    "scipy>=1.9.0",
    "pyyaml>=6.0",
    "tensorboardX>=2.5.1",
    "requests>=2.28.0",
    "openai>=1.0.0"
]
