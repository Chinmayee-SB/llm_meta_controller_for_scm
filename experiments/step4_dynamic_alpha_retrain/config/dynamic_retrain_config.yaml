# =============================================================================
# EXPERIMENT CONFIG — Step 4: Dynamic Mid-Episode Alpha Retraining
# Isolated configuration for training policy on dynamic alpha transitions (N=50)
# =============================================================================

environment:
  n_agents: 4                    # Retailer(1), Warehouse(2), Distributor(3), Manufacturer(4)
  episode_length: 200            # Total timesteps per episode
  lead_time: 4                   # Pipeline lag L=4
  O_max: 20                      # Maximum order per step (ACTION_DIM-1=20)
  initial_inventory: 10          # Starting inventory S_I=10
  initial_pipeline: 10           # Starting pipeline S_O=10
  holding_cost: 1.0              # h^i=1 uniform
  backlog_cost: 1.0              # b^i=1 uniform
  demand_clip_min: 1
  demand_clip_max: 40

demand:
  model: merton_jd
  mu: 5.0e-5                     # Serial Supply Chain Merton drift
  sigma: 1.0e-2                  # Volatility
  lambda: 15                     # Jump intensity
  l1: 10
  l2: 0
  l3: 0.01

happo:
  gru_num_layers: 2              # 2-layer GRU
  gru_hidden: 128                # Hidden size 128
  fc_hidden: 128
  gamma: 0.95                    # Discount factor
  gae_lambda: 0.95               # GAE lambda
  lr: 1.0e-4                     # Base learning rate
  ppo_clip: 0.2                  # Epsilon clip
  entropy_coeff: 0.01            # Initial entropy coefficient
  ppo_epoch: 15                  # Initial PPO epochs per update
  data_chunk_length: 10          # Recurrent chunk length
  max_grad_norm: 0.5
  weight_init: orthogonal
  use_huber_loss: true
  huber_delta: 10.0
  num_env_steps: 2000000         # 2M steps = 2000 episodes on 5 threads
  n_rollout_threads: 5           # Parallel env threads

dynamic_alpha:
  enabled: true                  # Dynamic intra-episodic transitions during training
  interval: 50                   # Switch alpha every 50 timesteps (t=0, 50, 100, 150)
  min: 0.1                       # Sampling floor
  max: 0.9                       # Sampling ceiling
  sampling: per_agent_independent_uniform
  in_actor_obs: true             # Alpha appended as 8th element of actor observation
  in_critic_obs: false           # Centralized critic uses 28 dims

stability_gate:
  n_random_traces: 50
  max_mean_cost: 20000
  max_std_cost: 7000
  max_catastrophic_episode_pct: 0.00
  min_mean_service_level: 0.45
  min_floor_service_level: 0.10
  max_mean_bullwhip: 3.5
  min_random_traces_passing: 35
